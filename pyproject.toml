[project]
name = "holodex-music-grabber"
version = "0.1.0"
description = "Automatic download of VTuber songs leveraging Holodex API and yt-dlp"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bgutil-ytdlp-pot-provider>=2.0.0",
    "httpx>=0.27.0",
    "yt-dlp>=2024.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
